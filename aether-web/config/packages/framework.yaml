# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Versiona os asset('...') com ?v=<APP_VERSION> -- cada deploy muda o
    # valor (ver deploy-aether.sh), então a URL do arquivo muda junto e o
    # Cloudflare/navegador nunca serve uma versão em cache antiga por engano.
    assets:
        version: '%env(APP_VERSION)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
